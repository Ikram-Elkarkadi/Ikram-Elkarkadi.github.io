<svg width="900" height="190" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="100%" stop-color="#13112E"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="190" rx="18" fill="url(#pBg)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Left: Interactive Portfolio Info -->
  <text x="36" y="46" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">LIVE INTERACTIVE EXPERIENCE</text>
  <text x="36" y="82" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800">Portfolio &amp; Live ML Grade Simulator</text>
  <text x="36" y="110" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="13.5">Explore my interactive terminal, 3D project cards, and real-time Chart.js Data Lab.</text>

  <!-- CTA Button Graphic -->
  <rect x="36" y="130" width="250" height="40" rx="20" fill="url(#ctaGrad)"/>
  <text x="161" y="155" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Launch ikram-elkarkadi.github.io ↗</text>

  <!-- Right: Mini Interactive Terminal Mockup -->
  <rect x="570" y="24" width="298" height="142" rx="12" fill="#020617" stroke="#334155"/>
  <circle cx="588" cy="40" r="4.5" fill="#EF4444"/>
  <circle cx="603" cy="40" r="4.5" fill="#F59E0B"/>
  <circle cx="618" cy="40" r="4.5" fill="#10B981"/>
  <text x="719" y="43" text-anchor="middle" fill="#64748B" font-family="Consolas, monospace" font-size="10.5">ikram@ai:~</text>
  <line x1="570" y1="54" x2="868" y2="54" stroke="#1E293B"/>

  <text x="586" y="76" fill="#10B981" font-family="Consolas, monospace" font-size="11.5">$ whoami</text>
  <text x="586" y="94" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">Data Science · ML · BI</text>
  <text x="586" y="116" fill="#10B981" font-family="Consolas, monospace" font-size="11.5">$ predict --model rf</text>
  <text x="586" y="134" fill="#38BDF8" font-family="Consolas, monospace" font-size="11">Random Forest Acc: 89.0%</text>
  <rect x="586" y="144" width="8" height="12" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
