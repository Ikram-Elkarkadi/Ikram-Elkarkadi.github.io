<svg width="900" height="175" viewBox="0 0 900 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgPipe" x1="0" y1="0" x2="900" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="100%" stop-color="#11182C"/>
    </linearGradient>
    <linearGradient id="linePipe" x1="60" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="900" height="175" rx="18" fill="url(#bgPipe)" stroke="#1E293B" stroke-width="1.5"/>
  <text x="32" y="34" fill="#38BDF8" font-family="Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">END-TO-END DATA SCIENCE METHODOLOGY</text>

  <!-- Connecting Line -->
  <line x1="115" y1="92" x2="785" y2="92" stroke="url(#linePipe)" stroke-width="2.5" stroke-dasharray="5 4"/>

  <!-- Step 1 -->
  <rect x="30" y="54" width="152" height="96" rx="12" fill="#0B1224" stroke="#06B6D4" stroke-opacity="0.5"/>
  <text x="106" y="78" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="11" font-weight="700">01. INGESTION</text>
  <text x="106" y="102" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">SQL · CSV · APIs</text>
  <text x="106" y="122" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">MySQL, MongoDB,</text>
  <text x="106" y="136" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">UCI Datasets</text>

  <!-- Step 2 -->
  <rect x="202" y="54" width="152" height="96" rx="12" fill="#0B1224" stroke="#38BDF8" stroke-opacity="0.5"/>
  <text x="278" y="78" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="11" font-weight="700">02. EDA &amp; CLEAN</text>
  <text x="278" y="102" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Pandas · NumPy</text>
  <text x="278" y="122" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">Outliers, Missing</text>
  <text x="278" y="136" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">Values, Seaborn</text>

  <!-- Step 3 -->
  <rect x="374" y="54" width="152" height="96" rx="12" fill="#0B1224" stroke="#6366F1" stroke-opacity="0.5"/>
  <text x="450" y="78" text-anchor="middle" fill="#A5B4FC" font-family="Consolas, monospace" font-size="11" font-weight="700">03. FEATURES</text>
  <text x="450" y="102" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Scaling · Encoding</text>
  <text x="450" y="122" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">Correlation Matrix,</text>
  <text x="450" y="136" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">Dimensionality</text>

  <!-- Step 4 -->
  <rect x="546" y="54" width="152" height="96" rx="12" fill="#0B1224" stroke="#8B5CF6" stroke-opacity="0.5"/>
  <text x="622" y="78" text-anchor="middle" fill="#C4B5FD" font-family="Consolas, monospace" font-size="11" font-weight="700">04. MODELING</text>
  <text x="622" y="102" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Scikit-learn ML</text>
  <text x="622" y="122" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">Random Forest (89%),</text>
  <text x="622" y="136" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">SVM, Cross-Val</text>

  <!-- Step 5 -->
  <rect x="718" y="54" width="152" height="96" rx="12" fill="#0B1224" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="794" y="78" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="11" font-weight="700">05. DEPLOY &amp; BI</text>
  <text x="794" y="102" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Web · Power BI</text>
  <text x="794" y="122" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">Interactive Dashboards</text>
  <text x="794" y="136" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10.5">&amp; Live Simulators</text>
</svg>
