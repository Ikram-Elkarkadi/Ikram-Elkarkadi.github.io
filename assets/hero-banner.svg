<svg width="900" height="290" viewBox="0 0 900 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spaceBg" x1="0" y1="0" x2="900" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="60%" stop-color="#040D21"/>
      <stop offset="100%" stop-color="#0A0F29"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="42" y1="130" x2="360" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="42" y1="228" x2="210" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="0.22" cy="0.55" r="0.4">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="0.8" cy="0.45" r="0.42">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="900" height="290" rx="20" fill="url(#spaceBg)"/>
  <rect width="900" height="290" rx="20" fill="url(#nebula1)"/>
  <rect width="900" height="290" rx="20" fill="url(#nebula2)"/>
  <rect x="1" y="1" width="898" height="288" rx="19" stroke="#00D4FF" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Constellation Background Stars & Lines -->
  <g stroke="#00D4FF" stroke-opacity="0.14" stroke-width="0.8">
    <line x1="70" y1="30" x2="185" y2="62"/>
    <line x1="185" y1="62" x2="310" y2="28"/>
    <line x1="310" y1="28" x2="415" y2="95"/>
    <line x1="115" y1="255" x2="260" y2="235"/>
    <line x1="400" y1="220" x2="470" y2="160"/>
  </g>
  <g fill="#00D4FF">
    <circle cx="70" cy="30" r="1.8" opacity="0.7"/>
    <circle cx="185" cy="62" r="2.2" opacity="0.5"/>
    <circle cx="310" cy="28" r="1.6" opacity="0.8"/>
    <circle cx="415" cy="95" r="2" opacity="0.45"/>
    <circle cx="115" cy="255" r="1.8" opacity="0.5"/>
    <circle cx="260" cy="235" r="1.5" opacity="0.7"/>
    <circle cx="400" cy="220" r="2" opacity="0.6"/>
    <circle cx="470" cy="160" r="1.8" opacity="0.55"/>
    <circle cx="445" cy="40" r="1.5" opacity="0.65"/>
  </g>

  <!-- Left Side: Exact Portfolio Hero Look -->
  <rect x="42" y="34" width="326" height="28" rx="14" fill="#00D4FF" fill-opacity="0.08" stroke="#00D4FF" stroke-opacity="0.28"/>
  <circle cx="60" cy="48" r="4.5" fill="#00FF88">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="74" y="52" fill="#00D4FF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600">Available for Data Science &amp; AI Collaborations</text>

  <text x="42" y="114" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">Ikram</text>
  <text x="42" y="164" fill="url(#nameGrad)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">Elkarkadi</text>

  <text x="42" y="192" fill="#94A3B8" font-family="Consolas, monospace" font-size="13">// Bachelor in Data Science · Morocco 🇲🇦</text>
  <text x="42" y="216" fill="#00D4FF" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600">From Raw Data to Real Impact.</text>

  <!-- CTA Buttons -->
  <rect x="42" y="232" width="166" height="36" rx="18" fill="url(#btnGrad)"/>
  <text x="125" y="254" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Explore Data Lab ↓</text>

  <rect x="220" y="232" width="166" height="36" rx="18" fill="#0F172A" fill-opacity="0.7" stroke="#334155"/>
  <text x="303" y="254" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">Try ML Simulator ⚡</text>

  <!-- Right Side: Data Science Terminal Card -->
  <rect x="470" y="26" width="394" height="238" rx="16" fill="#0A0F1E" fill-opacity="0.92" stroke="#00D4FF" stroke-opacity="0.32" stroke-width="1.2"/>
  <rect x="470" y="26" width="394" height="34" rx="16" fill="#FFFFFF" fill-opacity="0.03"/>
  <line x1="470" y1="60" x2="864" y2="60" stroke="#1E293B"/>
  <circle cx="490" cy="43" r="5" fill="#FF5F56"/>
  <circle cx="506" cy="43" r="5" fill="#FFBD2E"/>
  <circle cx="522" cy="43" r="5" fill="#27C93F"/>
  <text x="848" y="47" text-anchor="end" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">ikram@datascience:~ (python)</text>

  <!-- Data Science Python Output inside Terminal -->
  <text x="488" y="84" fill="#00FF88" font-family="Consolas, monospace" font-size="11.5">ikram@data:~$</text>
  <text x="582" y="84" fill="#00D4FF" font-family="Consolas, monospace" font-size="11.5">python train_model.py</text>

  <line x1="490" y1="98" x2="490" y2="196" stroke="#7C3AED" stroke-opacity="0.6" stroke-width="2"/>
  <text x="500" y="110" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">[EDA] Dataset: UCI Student (n=649, features=33)</text>
  <text x="500" y="130" fill="#CBD5E1" font-family="Consolas, monospace" font-size="11">[CLEAN] Nulls: 0 | Scaling: StandardScaler</text>
  <text x="500" y="150" fill="#38BDF8" font-family="Consolas, monospace" font-size="11">[TRAIN] RandomForestClassifier(n_estimators=200)</text>
  <text x="500" y="170" fill="#00FF88" font-family="Consolas, monospace" font-size="11" font-weight="700">[SCORE] Accuracy: 89.0% | F1-Score: 0.88 ✅</text>
  <text x="500" y="190" fill="#A5B4FC" font-family="Consolas, monospace" font-size="11">[BI] Exported interactive charts -&gt; Data Lab</text>

  <!-- Terminal Chips -->
  <rect x="488" y="216" width="66" height="24" rx="12" fill="#00D4FF" fill-opacity="0.1" stroke="#00D4FF" stroke-opacity="0.3"/>
  <text x="521" y="232" text-anchor="middle" fill="#00D4FF" font-family="Consolas, monospace" font-size="10.5">dataset</text>
  <rect x="562" y="216" width="48" height="24" rx="12" fill="#00D4FF" fill-opacity="0.1" stroke="#00D4FF" stroke-opacity="0.3"/>
  <text x="586" y="232" text-anchor="middle" fill="#00D4FF" font-family="Consolas, monospace" font-size="10.5">eda</text>
  <rect x="618" y="216" width="62" height="24" rx="12" fill="#00D4FF" fill-opacity="0.1" stroke="#00D4FF" stroke-opacity="0.3"/>
  <text x="649" y="232" text-anchor="middle" fill="#00D4FF" font-family="Consolas, monospace" font-size="10.5">models</text>
  <rect x="688" y="216" width="70" height="24" rx="12" fill="#00D4FF" fill-opacity="0.1" stroke="#00D4FF" stroke-opacity="0.3"/>
  <text x="723" y="232" text-anchor="middle" fill="#00D4FF" font-family="Consolas, monospace" font-size="10.5">pipeline</text>
  <rect x="766" y="216" width="62" height="24" rx="12" fill="#7C3AED" fill-opacity="0.18" stroke="#7C3AED" stroke-opacity="0.4"/>
  <text x="797" y="232" text-anchor="middle" fill="#C4B5FD" font-family="Consolas, monospace" font-size="10.5">run_ml</text>
</svg>
