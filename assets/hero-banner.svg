<svg width="900" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="55%" stop-color="#0D152B"/>
      <stop offset="100%" stop-color="#141132"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="60" y1="70" x2="460" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.82" cy="0.35" r="0.35">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.8" r="0.35">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="240" rx="20" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="20" fill="url(#glow1)"/>
  <rect width="900" height="240" rx="20" fill="url(#glow2)"/>
  <rect x="1" y="1" width="898" height="238" rx="19" stroke="url(#accentGrad)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Subtle Grid -->
  <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="225" y1="0" x2="225" y2="240"/>
    <line x1="450" y1="0" x2="450" y2="240"/>
    <line x1="675" y1="0" x2="675" y2="240"/>
  </g>

  <!-- Status Badge -->
  <rect x="48" y="34" width="265" height="28" rx="14" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-opacity="0.35"/>
  <circle cx="66" cy="48" r="4.5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="52" fill="#38BDF8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4">OPEN TO COLLABORATIONS &amp; INTERNSHIPS</text>

  <!-- Main Name & Role -->
  <text x="48" y="114" fill="url(#textGrad)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Ikram Elkarkadi</text>
  <text x="48" y="148" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="500">Data Science Student (Bachelor SD) · Machine Learning &amp; Big Data</text>
  <text x="48" y="176" fill="#94A3B8" font-family="Consolas, monospace" font-size="13">// "Turning Data Into Intelligence." · EST Kelaâ des Sraghna, Morocco</text>

  <!-- Bottom Accent Pills -->
  <rect x="48" y="194" width="88" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="92" y="210" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="11" font-weight="600">Python</text>
  <rect x="144" y="194" width="110" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="199" y="210" text-anchor="middle" fill="#A5B4FC" font-family="Consolas, monospace" font-size="11" font-weight="600">Scikit-learn</text>
  <rect x="262" y="194" width="76" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="300" y="210" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="11" font-weight="600">SQL</text>
  <rect x="346" y="194" width="96" height="24" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="394" y="210" text-anchor="middle" fill="#F472B6" font-family="Consolas, monospace" font-size="11" font-weight="600">Power BI</text>

  <!-- Right Side Animated Neural Network Graphic -->
  <g stroke="#38BDF8" stroke-opacity="0.32" stroke-width="1.3">
    <line x1="650" y1="65" x2="735" y2="48"/>
    <line x1="650" y1="65" x2="735" y2="120"/>
    <line x1="650" y1="120" x2="735" y2="48"/>
    <line x1="650" y1="120" x2="735" y2="120"/>
    <line x1="650" y1="120" x2="735" y2="190"/>
    <line x1="650" y1="175" x2="735" y2="120"/>
    <line x1="650" y1="175" x2="735" y2="190"/>
    <line x1="735" y1="48" x2="825" y2="85"/>
    <line x1="735" y1="120" x2="825" y2="85"/>
    <line x1="735" y1="120" x2="825" y2="155"/>
    <line x1="735" y1="190" x2="825" y2="155"/>
  </g>
  <!-- Nodes -->
  <circle cx="650" cy="65" r="7" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>
  <circle cx="650" cy="120" r="7" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>
  <circle cx="650" cy="175" r="7" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>

  <circle cx="735" cy="48" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="2.5">
    <animate attributeName="r" values="7;9.5;7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="735" cy="120" r="9" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5">
    <animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="735" cy="190" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="2.5">
    <animate attributeName="r" values="7;9.5;7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="825" cy="85" r="8.5" fill="#10B981"/>
  <circle cx="825" cy="155" r="8.5" fill="#EC4899"/>
